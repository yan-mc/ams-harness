  disabled: true
- id: experimental-api-speech-to-text
  disabled: true
- id: experimental-voice-input-bundle
  disabled: true
- id: experimental-client-ui-voice-input
  disabled: true

# ---- 8) 实验性功能（减面/减风险；以实际 dump 为准，P1 包级移除） ----
- id: experimental-inspector
  disabled: true
- id: experimental-inspector-profile
  disabled: true
- id: experimental-session-inspector
  disabled: true
- id: experimental-cot-translation-bundle
  disabled: true
- id: experimental-client-ui-cot-translation
  disabled: true
- id: experimental-translator
  disabled: true
- id: experimental-agent-team-profile
  disabled: true
- id: experimental-ralph-bundle
